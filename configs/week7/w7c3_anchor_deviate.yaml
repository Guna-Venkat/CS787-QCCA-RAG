# ==============================================================================
# Week 7-C3: Anchor-and-Deviate Semantic Budget Policy Configuration
# ==============================================================================
# Deployment anchor at semantic k=4.
# Asymmetric decision:
#   1. Safe-downshift: can query safely use k=2? (P_down >= tau_down)
#   2. Selective-upshift: does k > 4 meaningfully improve quality? (P_up >= tau_up)
#   3. Larger-budget selector: delta regression relative to k=4 (Delta_5, Delta_6, Delta_8)
# If neither condition satisfied: k=4 anchor retained.
# ==============================================================================

experiment:
  name: "w7c3_anchor_deviate"
  week: "week7"
  subtask: "W7-C3"
  anchor_k: 4
  budgets: [2, 4, 5, 6, 8]
  epsilon: 0.01
  preference_epsilon: 0.01
  quality_tolerance_eta: 0.005
  eta_grid: [0.000, 0.0025, 0.005, 0.01]
  test_disabled: true
  random_seed: 42

paths:
  train_candidate_features: "results/week7/w7c_retrieval_aware_allocator/features/train_candidate_budget_features.parquet"
  dev_candidate_features: "results/week7/w7c_retrieval_aware_allocator/features/dev_candidate_budget_features.parquet"
  train_response_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  dev_response_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"
  train_fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"
  w7c2_main_results: "results/week7/w7c2_utility_ranking/tables/w7c2_main_dev_results.csv"
  w7c1_main_results: "results/week7/w7c_retrieval_aware_allocator/tables/w7c_main_dev_results.csv"
  w6a_main_results: "results/week6/w6a_routing_response_surface/tables/w6a_main_results.csv"
  output_dir: "results/week7/w7c3_anchor_deviate"
  tables_dir: "results/week7/w7c3_anchor_deviate/tables"
  figures_dir: "results/week7/w7c3_anchor_deviate/figures"
  models_dir: "results/week7/w7c3_anchor_deviate/models"
  oof_dir: "results/week7/w7c3_anchor_deviate/oof"
  bootstrap_dir: "results/week7/w7c3_anchor_deviate/bootstrap"
  diagnostics_dir: "results/week7/w7c3_anchor_deviate/diagnostics"
  cross_encoder_dir: "results/week7/w7c3_anchor_deviate/cross_encoder"

cross_encoder:
  enabled: false
  model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  cache_dir: "results/week7/w7c3_anchor_deviate/cross_encoder"

group_k_fold:
  n_splits: 5
  group_column: "paper_id"
  shuffle: true
  random_state: 42

policy_grids:
  tau_down_grid: [0.70, 0.75, 0.80, 0.85, 0.90, 0.95]
  tau_up_grid: [0.55, 0.60, 0.65, 0.70, 0.75, 0.80, 0.85]
  delta_up_grid: [0.0, 0.005, 0.01, 0.02]

model_hyperparameters:
  downshift_classifier:
    model_family: "lgbm"
    max_depth: 4
    num_leaves: 15
    n_estimators: 100
    learning_rate: 0.05
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  upshift_classifier:
    model_family: "lgbm"
    max_depth: 4
    num_leaves: 15
    n_estimators: 100
    learning_rate: 0.05
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42
  delta_regressors:
    model_family: "lgbm"
    targets: [5, 6, 8]
    max_depth: 4
    num_leaves: 15
    n_estimators: 100
    learning_rate: 0.05
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
    random_state: 42

bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
  random_seed: 42

stopping_rule:
  pareto_reference:
    k: 4
    f1: 0.3909
    tokens: 921.1
  action_on_failure: "STOP_ADAPTIVE_K_PROCEED_TO_W7D"
