# Week 7-C: Retrieval-Aware Semantic Sufficiency Allocation
# Formulates budget selection as candidate-level sufficiency prediction (q, k) -> P(z=1), regret

research_question: "Can retrieval-aware, set-level, semantic-routing-specific features predict whether a given representation budget is sufficient for downstream SARA generation?"

seed: 42
seeds: [42, 123, 2026]

budgets: [2, 4, 5, 6, 8]
epsilon: 0.01

test_disabled: true

# Feature extraction settings
features:
  enable_query_features: true
  enable_semantic_geometry: true
  enable_bm25_qpp: true
  enable_cross_retriever: true
  enable_set_diversity: true
  enable_tail_threat: true
  enable_query_coverage: true
  enable_cost_features: true
  enable_cross_encoder_features: true
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  semantic_encoder_model: "sentence-transformers/all-MiniLM-L6-v2"

# Feature ablation sets
ablations:
  F0: "old_w4_baseline"
  F1: "query_plus_retrieval_geometry"
  F2: "retrieval_aware"
  F3: "set_aware"
  F4: "sufficiency_focused"
  F5: "sufficiency_plus_cross_encoder"

# Decision policy
policy:
  tau_grid: [0.50, 0.60, 0.70, 0.80, 0.90]
  default_tau: 0.70
  fallback_budget: 8
  regret_max_threshold: 0.05

# Model configurations
models:
  primary: "lightgbm_gbdt"
  lightgbm:
    max_depth: [3, 5, 7]
    num_leaves: [7, 15, 31]
    n_estimators: [50, 100]
    learning_rate: [0.05, 0.1]
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
  mlp:
    hidden_dims: [64, 32]
    dropout: 0.2
    learning_rate: 0.001
    weight_decay: 1e-4
    epochs: 30
    batch_size: 64
    lambda_cls: 1.0
    lambda_reg: 0.5
  set_encoder:
    enabled: true
    d_model: 64
    n_heads: 4
    n_layers: 2
  generator_probe:
    enabled: true
    layers: [16, 24, 31]
    probe_type: "logistic_regression"

bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
  cluster_col: "paper_id"

paths:
  results_root: "results/week7/w7c_retrieval_aware_allocator"
  features_dir: "results/week7/w7c_retrieval_aware_allocator/features"
  models_dir: "results/week7/w7c_retrieval_aware_allocator/models"
  tables_dir: "results/week7/w7c_retrieval_aware_allocator/tables"
  figures_dir: "results/week7/w7c_retrieval_aware_allocator/figures"
  bootstrap_dir: "results/week7/w7c_retrieval_aware_allocator/bootstrap"
  diagnostics_dir: "results/week7/w7c_retrieval_aware_allocator/diagnostics"
  smoke_dir: "results/week7/w7c_retrieval_aware_allocator/diagnostics/smoke"
  logs_dir: "results/week7/w7c_retrieval_aware_allocator/logs"
  probe_dir: "results/week7/w7c_retrieval_aware_allocator/generator_probe"

  # Canonical W7-B response surfaces (supervision source)
  train_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  train_semantic_results: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_results.jsonl"
  dev_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"
  dev_semantic_results: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_results.jsonl"
  train_semantic_supervision: "results/week7/w7b_semantic_budget/supervision/train_semantic_allocation_supervision.csv"
  dev_semantic_oracle: "results/week7/w7b_semantic_budget/supervision/dev_semantic_oracle_analysis.csv"

  # Retrieval bundles and split manifests
  train_retrieval: "results/week5/train_response_surface/train_retrieval.jsonl"
  dev_retrieval: "results/week2/raw/dev_retrieval.jsonl"
  train_fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"

  # Passage and query embeddings
  train_sfr_embeddings_file: "results/week5/train_response_surface/train_sfr_embeddings.pt"
  dev_sfr_embeddings_file: "results/week2/raw/dev_sfr_embeddings.pt"

  # Historical baselines
  w4_feature_matrix: "results/week4/feature_discovery/feature_matrix.csv"
  w6_main_results: "results/week6/passage_routing/tables/w6_main_results.csv"
  w7a_main_results: "results/week7/w7a_budget_semantic_composition/tables/w7a_main_results.csv"
  w7b_main_results: "results/week7/w7b_semantic_budget/tables/w7b_main_results.csv"
