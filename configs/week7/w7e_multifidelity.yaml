# ==============================================================================
# Week 7-E: Multi-Fidelity Evidence Representation Configuration
# ==============================================================================
# Replaces binary FULL vs HEAVY with FULL / MEDIUM / HEAVY multi-fidelity:
#   FULL:   Original natural-language passage text
#   MEDIUM: Query-focused extractive natural-language text (token-capped)
#   HEAVY:  Canonical SARA SFR-compressed embedding (<COMPRESS>)
# ==============================================================================

experiment:
  name: "w7e_multifidelity"
  week: "week7"
  subtask: "W7-E"
  budgets: [2, 4, 5, 6, 8]
  epsilon: 0.01
  test_disabled: true
  random_seed: 42

representation:
  FULL: "original_text"
  MEDIUM: "query_focused_extractive_text"
  HEAVY: "canonical_sara_embedding"

medium_compression:
  medium_token_caps: [64, 96, 128]
  default_token_cap: 96
  scorer_type: "cross_encoder" # "cross_encoder" or "semantic"
  cross_encoder_model: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  semantic_encoder_model: "sentence-transformers/all-MiniLM-L6-v2"
  batch_size: 32

policies:
  primary_policy_e1:
    name: "E1_primary_4F_2M_4H"
    full_ranks: [1, 2, 3, 4]
    medium_ranks: [5, 6]
    heavy_ranks: [7, 8, 9, 10]

  baseline_e0:
    name: "E0_baseline_4F_0M_6H"
    full_ranks: [1, 2, 3, 4]
    medium_ranks: []
    heavy_ranks: [5, 6, 7, 8, 9, 10]

  baseline_e2:
    name: "E2_baseline_6F_0M_4H"
    full_ranks: [1, 2, 3, 4, 5, 6]
    medium_ranks: []
    heavy_ranks: [7, 8, 9, 10]

  secondary_e3:
    name: "E3_secondary_2F_2M_6H"
    full_ranks: [1, 2]
    medium_ranks: [3, 4]
    heavy_ranks: [5, 6, 7, 8, 9, 10]

  secondary_e4:
    name: "E4_secondary_4F_4M_2H"
    full_ranks: [1, 2, 3, 4]
    medium_ranks: [5, 6, 7, 8]
    heavy_ranks: [9, 10]

  cross_encoder_medium_selection:
    enabled: true
    name: "E1X_cross_encoder_medium"
    n_full: 4
    n_medium: 2
    n_heavy: 4
    candidate_ranks_for_medium: [5, 6, 7, 8, 9, 10]

  ce_full_allocation:
    enabled: true
    name: "E_CE_allocation"
    n_full: 4
    n_medium: 2
    n_heavy: 4

sara:
  checkpoint_path: "Baselines/SARA-main/checkpoints/finetune/sara_qasper_proj_lr5e4_seed42"
  checkpoint_id: "sara_qasper_proj_lr5e4_seed42"
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0

bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
  random_seed: 42

paths:
  # Retrieval and response surfaces
  train_retrieval: "results/week5/train_response_surface/train_retrieval.jsonl"
  dev_retrieval: "results/week2/raw/dev_retrieval.jsonl"
  train_response_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  dev_response_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"
  train_sfr_embeddings: "results/week5/train_response_surface/train_sfr_embeddings.pt"
  dev_sfr_embeddings: "results/week2/raw/dev_sfr_embeddings.pt"
  train_cross_encoder_scores: "results/week7/w7d_cross_encoder_router/cross_encoder/train_cross_encoder_scores.parquet"
  dev_cross_encoder_scores: "results/week7/w7d_cross_encoder_router/cross_encoder/dev_cross_encoder_scores.parquet"
  train_fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"
  w7c3_main_results: "results/week7/w7c3_anchor_deviate/tables/w7c3_main_dev_results.csv"

  # Outputs
  output_dir: "results/week7/w7e_multifidelity"
  medium_cache_dir: "results/week7/w7e_multifidelity/medium_cache"
  train_dir: "results/week7/w7e_multifidelity/train"
  dev_dir: "results/week7/w7e_multifidelity/dev"
  tables_dir: "results/week7/w7e_multifidelity/tables"
  figures_dir: "results/week7/w7e_multifidelity/figures"
  bootstrap_dir: "results/week7/w7e_multifidelity/bootstrap"
  diagnostics_dir: "results/week7/w7e_multifidelity/diagnostics"
  smoke_dir: "results/week7/w7e_multifidelity/diagnostics/smoke"
  logs_dir: "results/week7/w7e_multifidelity/logs"
