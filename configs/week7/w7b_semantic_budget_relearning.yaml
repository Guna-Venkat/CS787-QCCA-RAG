# Week 7-B: Semantic-Routing-Aware Budget Response Surface and Adaptive Allocation
# Evaluates how semantic routing changes per-query quality response surfaces and relearns adaptive budget allocation.

research_question: "How does semantic passage routing change the per-query quality-vs-budget response surface, and can a budget allocator learn this new regime?"

seed: 42
seeds: [42, 123, 2026]

budgets: [2, 4, 5, 6, 8]
epsilon: 0.01

test_disabled: true

routing:
  method: "R1_semantic_topk"
  encoder_model: "sentence-transformers/all-MiniLM-L6-v2"
  max_seq_length: 256
  frozen: true
  device: "cuda"

sara:
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0
  device: "cuda"

features:
  stage2_core_features:
    - "bm25_mean_score"
    - "lex_coverage_top2"
    - "sem_sim_mean_top6"
    - "evidence_query_cluster_span"
    - "evidence_lexical_overlap_mean"

training:
  target_epsilon: 0.01
  model_families:
    - "balanced_logistic_regression_cascade"
    - "multiclass_balanced_logistic_regression"
    - "ridge_classifier"
  val_metric: "downstream_f1"

bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
  cluster_col: "paper_id"

paths:
  results_root: "results/week7/w7b_semantic_budget"
  response_surface_dir: "results/week7/w7b_semantic_budget/response_surface"
  supervision_dir: "results/week7/w7b_semantic_budget/supervision"
  models_dir: "results/week7/w7b_semantic_budget/models"
  tables_dir: "results/week7/w7b_semantic_budget/tables"
  figures_dir: "results/week7/w7b_semantic_budget/figures"
  bootstrap_dir: "results/week7/w7b_semantic_budget/bootstrap"
  diagnostics_dir: "results/week7/w7b_semantic_budget/diagnostics"
  smoke_dir: "results/week7/w7b_semantic_budget/diagnostics/smoke"
  logs_dir: "results/week7/w7b_semantic_budget/logs"

  # Data splits & artifacts
  train_retrieval: "results/week5/train_response_surface/train_retrieval.jsonl"
  dev_retrieval: "results/week2/raw/dev_retrieval.jsonl"
  train_fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"

  # Canonical BM25 response surfaces
  train_bm25_matrix: "results/week5/train_response_surface/train_fixed_k_matrix.csv"
  dev_bm25_matrix: "results/week2/raw/dev_fixed_k_matrix.jsonl"

  # Embedding caches & SARA checkpoint
  train_sfr_embeddings_file: "results/week5/train_response_surface/train_sfr_embeddings.pt"
  dev_sfr_embeddings_file: "results/week2/raw/dev_sfr_embeddings.pt"
  sara_checkpoint: "Baselines/SARA-main/checkpoints/finetune/sara_qasper_proj_lr5e4_seed42"

  # W4 feature source & historical predictions
  dev_features_matrix: "results/week4/feature_discovery/feature_matrix.csv"
  w4_budget_predictions: "results/week4/qcca_v2_final_validation/stage2_oof_predictions.csv"
  w6a_main_results: "results/week6/passage_routing/tables/w6_main_results.csv"
  w7a_main_results: "results/week7/w7a_budget_semantic_composition/tables/w7a_main_results.csv"

  # W7-B response surface outputs
  train_semantic_results: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_results.jsonl"
  train_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  dev_semantic_results: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_results.jsonl"
  dev_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"
  train_semantic_supervision: "results/week7/w7b_semantic_budget/supervision/train_semantic_allocation_supervision.csv"
  dev_semantic_oracle: "results/week7/w7b_semantic_budget/supervision/dev_semantic_oracle_analysis.csv"
