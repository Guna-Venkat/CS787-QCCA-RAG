# Week 7-C2: Utility-Aware Budget Ranking and Continuation Policy
# Reformulates budget selection from independent binary sufficiency classification
# to direct downstream utility prediction and query-grouped learning-to-rank.

research_question: "Can we learn the relative downstream utility of candidate representation budgets directly, rather than classifying each budget independently as sufficient/insufficient?"

seed: 42
seeds: [42, 123, 2026]

budgets: [2, 4, 5, 6, 8]
epsilon: 0.01
preference_epsilon: 0.01

test_disabled: true

# M1 Direct Regression near-tie cost margin grid
m1_policy:
  delta_grid: [0.00, 0.005, 0.01, 0.02, 0.03]
  default_delta: 0.01

# M2 Ranking score near-tie cost margin grid
m2_policy:
  score_tie_margin_grid: [0.00, 0.02, 0.05, 0.10]
  default_tie_margin: 0.02

# Models configuration
models:
  primary: "m2_query_grouped_ranker"
  m1_regression:
    model_type: "lightgbm_regressor"
    max_depth: [3, 5, 7]
    learning_rate: [0.03, 0.07]
    n_estimators: [50, 100]
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
  m2_ranking:
    model_type: "lightgbm_ranker"
    max_depth: [3, 5, 7]
    learning_rate: [0.03, 0.07]
    n_estimators: [50, 100]
    min_child_samples: 20
    subsample: 0.8
    colsample_bytree: 0.8
  m3_continuation:
    enabled: true
    stages: [2, 4, 5, 6]
    max_depth: 4
    n_estimators: 50
    learning_rate: 0.05
  cross_encoder:
    enabled: true
    model_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"

bootstrap:
  n_resamples: 2000
  confidence_level: 0.95
  cluster_col: "paper_id"

paths:
  results_root: "results/week7/w7c2_utility_ranking"
  models_dir: "results/week7/w7c2_utility_ranking/models"
  tables_dir: "results/week7/w7c2_utility_ranking/tables"
  figures_dir: "results/week7/w7c2_utility_ranking/figures"
  bootstrap_dir: "results/week7/w7c2_utility_ranking/bootstrap"
  diagnostics_dir: "results/week7/w7c2_utility_ranking/diagnostics"
  smoke_dir: "results/week7/w7c2_utility_ranking/diagnostics/smoke"
  logs_dir: "results/week7/w7c2_utility_ranking/logs"
  cross_encoder_dir: "results/week7/w7c2_utility_ranking/cross_encoder"

  # Canonical W7-B response surfaces
  train_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  dev_semantic_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"

  # W7-C1 Feature Bank (reused directly)
  train_candidate_features: "results/week7/w7c_retrieval_aware_allocator/features/train_candidate_budget_features.parquet"
  dev_candidate_features: "results/week7/w7c_retrieval_aware_allocator/features/dev_candidate_budget_features.parquet"

  # Splits & manifests
  train_fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"
  dev_retrieval: "results/week2/raw/dev_retrieval.jsonl"
  train_retrieval: "results/week5/train_response_surface/train_retrieval.jsonl"

  # Historical Baselines
  w6_main_results: "results/week6/passage_routing/tables/w6_main_results.csv"
  w7a_main_results: "results/week7/w7a_budget_semantic_composition/tables/w7a_main_results.csv"
  w7b_main_results: "results/week7/w7b_semantic_budget/tables/w7b_main_results.csv"
  w7c1_main_results: "results/week7/w7c_retrieval_aware_allocator/tables/w7c_main_dev_results.csv"
  w7c1_ablation_results: "results/week7/w7c_retrieval_aware_allocator/tables/w7c_feature_ablation_internal_val.csv"
