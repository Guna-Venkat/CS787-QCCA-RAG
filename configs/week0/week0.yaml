# Week 0: Dataset + RAG Evidence Understanding / Motivation Study
# Configuration file for CS787 research project (SARA / QCCA)

seed: 42

dataset:
  name: "qasper"
  train_split: "Baselines/SARA-main/data/reformatted/QASPER_train_split.jsonl"
  dev_split: "Baselines/SARA-main/data/reformatted/QASPER_dev.jsonl"
  raw_arrow_train: "/home/gunavenkat/.cache/huggingface/datasets/allenai___qasper/qasper/0.3.0/fdc9d8214fbab5dd782958601db4d678e6934a54/qasper-train.arrow"
  raw_arrow_val: "/home/gunavenkat/.cache/huggingface/datasets/allenai___qasper/qasper/0.3.0/fdc9d8214fbab5dd782958601db4d678e6934a54/qasper-validation.arrow"
  manifest: "Baselines/SARA-main/data/manifests/qasper_split.json"
  dev_retrieval_file: "results/week2/raw/dev_retrieval.jsonl"
  dev_sfr_embeddings_file: "results/week2/raw/dev_sfr_embeddings.pt"

sampling:
  layer_analysis_sample_size: 40
  ablation_sample_size: 20
  stratify_by: "question_type"
  random_seed: 42

models:
  base_model: "mistralai/Mistral-7B-Instruct-v0.2"
  sara_checkpoint: "Baselines/SARA-main/checkpoints/finetune/sara_qasper_proj_lr5e4_seed42"
  rag_checkpoint: "Baselines/SARA-main/checkpoints/finetune/rag_qasper_lora_r16_seed42"
  device: "cuda"
  dtype: "bfloat16"
  retrieval_top_n: 10
  selected_layers: [0, 4, 8, 16, 24, 31]  # 0=embed, 4,8=early, 16=middle, 24=late, 31=final
  max_context_tokens: 2048

attention:
  token_direction: "query_to_passage"  # question/answer tokens attend to passage tokens
  normalize_by_length: true
  average_heads: true

intervention:
  metric: "teacher_forced_log_prob"
  use_generation_f1: false

paths:
  results_dir: "results/week0"
  dataset_analysis_dir: "results/week0/dataset_analysis"
  layer_analysis_dir: "results/week0/layer_analysis"
  evidence_analysis_dir: "results/week0/evidence_analysis"
  sara_motivation_dir: "results/week0/sara_motivation"
  figures_dir: "results/week0/figures"
  tables_dir: "results/week0/tables"
