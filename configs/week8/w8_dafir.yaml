week8:
  name: DAFiR
  full_name: "Draft-Aware Fidelity Routing for Compressed RAG"
  alternative_name: "Generator-Aware Selective Decompression and Counterfactual Evidence Utility for Compressed RAG"
  epsilon_help: 0.01
  epsilon_hurt: -0.01
  max_promotions: 2
  seed: 42

sara:
  checkpoint_path: "Baselines/SARA-main/checkpoints/finetune/sara_qasper_proj_lr5e4_seed42"


splits:
  train_retrieval: "results/week5/train_response_surface/train_retrieval.jsonl"
  train_sfr_embeddings: "results/week5/train_response_surface/train_sfr_embeddings.pt"
  fit_manifest: "results/week5/content_allocator/w5b/splits/train_fit_manifest.csv"
  internal_val_manifest: "results/week5/content_allocator/w5b/splits/internal_val_manifest.csv"
  dev_retrieval: "results/week2/raw/dev_retrieval.jsonl"
  dev_sfr_embeddings: "results/week2/raw/dev_sfr_embeddings.pt"
  dev_response_matrix: "results/week7/w7b_semantic_budget/response_surface/dev_semantic_fixed_k_matrix.csv"
  train_response_matrix: "results/week7/w7b_semantic_budget/response_surface/train_semantic_fixed_k_matrix.csv"
  test_disabled: true

paths:
  results_dir: "results/week8"
  promotion_surface_dir: "results/week8/w8a_promotion_surface"
  uncertainty_dir: "results/week8/w8b_uncertainty"
  utility_dir: "results/week8/w8c_utility"
  attribution_dir: "results/week8/w8d_attribution"
  controller_dir: "results/week8/w8e_controller"
  qcla_dir: "results/week8/w8f_qcla"
  hard_case_dir: "results/week8/w8g_hard_case"
  full_system_dir: "results/week8/w8h_full_system"
  ablations_dir: "results/week8/w8i_ablations"
  final_dev_dir: "results/week8/w8j_final_dev"
  shared_cache_dir: "results/week8/shared_cache"
  tables_dir: "results/week8/tables"
  figures_dir: "results/week8/figures"
  logs_dir: "results/week8/logs"
  diagnostics_dir: "results/week8/diagnostics"

base:
  semantic_full_k: 4
  candidate_ranks: [5, 6, 7, 8, 9, 10]
  semantic_scorer_name: "sentence-transformers/all-MiniLM-L6-v2"
  sara_checkpoint: "Baselines/SARA-main/checkpoints/finetune/sara_qasper_proj_lr5e4_seed42"
  max_new_tokens: 128
  do_sample: false
  temperature: 0.0

oracle:
  enable_single: true
  enable_greedy_two: true
  epsilon_selective: 0.01

draft:
  self_consistency_samples: 3
  temperature: 0.7
  top_p: 0.9

utility:
  train_u0: true
  train_u1: true
  train_u2: true
  train_u3: true
  train_u4: true
  cross_encoder_name: "cross-encoder/ms-marco-MiniLM-L-6-v2"
  qlora_base_model: "mistralai/Mistral-7B-Instruct-v0.2"

attribution:
  attention_features: true
  masking_fallback: true

marginal_information:
  alpha_candidates: [0.1, 0.3, 0.5, 0.7, 1.0]
  beta_candidates: [0.1, 0.3, 0.5, 0.7, 1.0]
  default_alpha: 0.5
  default_beta: 0.5

qcla:
  train_qcla0: true
  train_qcla1: true
  train_qcla2: true
  hidden_dim: 4096
  bottleneck_dim: 2048
  learning_rate: 1.0e-4
  gradient_accumulation_steps: 16

hard_case:
  train_hc_lora: true
  train_outcome_weighted_lora: true
  lora_r: 8
  lora_alpha: 16
  lora_dropout: 0.05
  lora_target_modules: ["q_proj", "k_proj", "v_proj", "o_proj"]
  gamma_candidates: [0.5, 1.0, 2.0]
  default_gamma: 1.0

controller:
  evaluate_dafir1: true
  evaluate_dafir2: true
  lambda_h_grid: [0.5, 1.0, 1.5, 2.0]
  lambda_d_grid: [0.1, 0.5, 1.0]
  tau_h_grid: [0.3, 0.4, 0.5, 0.6]
  tau_d_grid: [0.3, 0.4, 0.5]

bootstrap:
  n_samples: 2000
  confidence_level: 0.95

TEST_DISABLED: true
